name: EAS Build

on:
  # push: # Triggers the workflow when code is pushed to the main branch
  #   branches:
  #     - main # Or whichever branch you want to trigger the build
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout repo
        uses: actions/checkout@v4

      # Node setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      # Install jq (for parsing JSON)
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # Setup EAS CLI + login
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Install dependencies (root - works for monorepo too)
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Verify Expo login (fail if not logged in)
      - name: Verify Expo login
        run: eas whoami || exit 1

      # Run EAS Build and capture output
      - name: Run EAS Build
        id: eas_build
        working-directory: ./apps/mobile-app
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          echo "Starting EAS Build..."

          BUILD_OUTPUT=$(eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --no-wait \
            --json)

          echo "$BUILD_OUTPUT"

          # Debug: Print entire build output object
          echo "DEBUG: Full Build Output:"
          echo "$BUILD_OUTPUT" | jq .

          # Extract and print all URLs for logging
          echo "DEBUG: Extracted Build URLs:"
          echo "$BUILD_OUTPUT" | jq -r '.[] | "\(.platform): \(.buildDetailsPageUrl)"'

          # Append info to GitHub Summary
          echo "## EAS Build Info" >> $GITHUB_STEP_SUMMARY
          echo "Android production build has been successfully initiated via EAS." >> $GITHUB_STEP_SUMMARY
          echo "Build initiated successfully." >> $GITHUB_STEP_SUMMARY

      # Print links in logs
      - name: Show Build Logs
        run: |
          echo "EAS Build has started. Check the 'Run EAS Build' step output for raw build details."

